# XcodeGen spec. Generate the Xcode project with:
#   DEVELOPMENT_TEAM=<your 10-char team id> xcodegen generate
# The .xcodeproj is gitignored; this file is the source of truth.
name: StepCounter

options:
  bundleIdPrefix: com.eddie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  StepCounter:
    type: application
    platform: iOS
    sources:
      - StepCounter
      - Shared
    settings:
      base:
        PRODUCT_NAME: Steps
        PRODUCT_BUNDLE_IDENTIFIER: com.eddie.stepcounter
        INFOPLIST_FILE: StepCounter/Info.plist
        CODE_SIGN_ENTITLEMENTS: StepCounter/StepCounter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: StepWidget
        embed: true

  StepWidget:
    type: app-extension
    platform: iOS
    sources:
      - StepWidget
      - Shared
    settings:
      base:
        PRODUCT_NAME: StepWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.eddie.stepcounter.widget
        INFOPLIST_FILE: StepWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StepWidget/StepWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
